name: Final Evaluation Autograding

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  grade:
    if: startsWith(github.head_ref, 'feature/evaluation-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Run Autograding Script
        id: grade
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/grade-pr.sh | tee final-grade-output.txt
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Post Mentor Feedback
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- bitbybit-mentor-feedback:final -->';
            const outcome = '${{ steps.grade.outcome }}';
            const issue_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const summary = fs.existsSync('final-grade-output.txt')
              ? fs.readFileSync('final-grade-output.txt', 'utf8').trim()
              : 'No grading output was captured.';

            const body = `${marker}
            ## BitByBit Academy Mentor Feedback

            Final evaluation result: **${outcome === 'success' ? 'PASS' : 'FAIL'}**

            This workflow validates:
            - your final branch name
            - the PR target branch
            - the required final submission file
            - the required commit message
            - commit signing on the branch tip

            ${outcome === 'success'
              ? 'Your final submission meets the automated rules for this course. Confirm that GitHub also shows the latest commit as Verified.'
              : 'Review the failing rule below, fix it locally, and push again. The workflow will rerun automatically.'}

            \`\`\`text
            ${summary}
            \`\`\``;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

            if (outcome === 'success') {
              const allIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open'
              });
              const courseIssue = allIssues.find((issue) => issue.labels.some((l) => l.name === 'course:step-4'));
              if (courseIssue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: courseIssue.number,
                  state: 'closed'
                });
              }
            }

      - name: Fail Workflow If Final Check Failed
        if: steps.grade.outcome == 'failure'
        run: exit 1
